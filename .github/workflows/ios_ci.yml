name: iOS CI

# Builds the example app for iOS, which compiles the library's Swift with it.
# Release calls this workflow too, on the commit it publishes.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_call:

permissions:
  contents: read

jobs:
  ios-compile:
    name: Build the iOS example
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
        cache-dependency-path: |
          yarn.lock
          example/yarn.lock

    # Builds build/, which Metro bundles into the app: the example imports the
    # library from the repository root.
    - name: Install node modules
      run: yarn install --frozen-lockfile

    - name: Install example node modules
      run: yarn install --frozen-lockfile
      working-directory: example

    # example/ios is committed, so there is nothing to prebuild.
    - name: Pod install
      run: pod install
      working-directory: example/ios

    # Debug, for a device, without signing. A build for a device also bundles
    # the JavaScript with Metro.
    - name: Compile the example
      working-directory: example/ios
      run: |
        xcodebuild -workspace reactnativeotpdetectorexample.xcworkspace \
          -scheme reactnativeotpdetectorexample \
          -configuration Debug \
          -destination generic/platform=iOS \
          -quiet \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_ALLOWED=NO \
          build
